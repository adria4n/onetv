<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
</head>
<body>

<iframe id="player" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>

<script>
const url = new URLSearchParams(window.location.search).get("url");

if (url) {
    let finalUrl = url;

    try {
        const u = new URL(url);

        if (u.hostname.includes("youtube.com") && u.pathname === "/watch") {
            const videoId = u.searchParams.get("v");

            if (videoId) {
                finalUrl = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
            }
        } else if (u.hostname === "youtu.be") {
            const videoId = u.pathname.substring(1);

            if (videoId) {
                finalUrl = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
            }
        }
    } catch (e) {
        console.error("URL inválida:", e);
    }

    document.getElementById("player").src = finalUrl;
}
</script>

</body>
</html>
