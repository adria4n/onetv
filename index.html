<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>body{margin:0;background:#000}video{width:100%;height:100vh}</style>
</head>
<body>
<video id="v" controls autoplay></video>
<script>
const u = decodeURIComponent(location.href.split('=')[1] || '');
const v = document.getElementById('v');
if (u && Hls.isSupported()) {
    const h = new Hls();
    h.loadSource(u);
    h.attachMedia(v);
    h.on(Hls.Events.MANIFEST_PARSED, () => v.play());
} else if (u && v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = u;
}
</script>
</body>
</html>
