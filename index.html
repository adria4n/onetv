<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Redirect</title>
</head>
<body>
<script>
const u = decodeURIComponent(location.href.split('=')[1] || '');
if (u) {
    location.replace(u);
} else {
    document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:20%">No se encontró URL después del =</p>';
}
</script>
</body>
</html>
